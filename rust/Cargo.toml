[package]
name = "link-assistant-agent"
version = "0.10.2"
edition = "2021"
description = "A minimal, public domain AI CLI agent compatible with OpenCode's JSON interface"
license = "Unlicense"
authors = ["Link Assistant"]
repository = "https://github.com/link-assistant/agent"
keywords = ["ai", "cli", "agent", "opencode", "assistant"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI argument parsing
clap = { version = "4.6.7", features = ["derive"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }

# JSON serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# HTTP client (for API calls)
reqwest = { version = "0.13.5", features = ["json", "stream"] }

# Path and file handling
walkdir = "2.5.0"
glob = "0.3.4"
regex = "1.13.1"
ignore = "0.4.33"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Unique identifiers
ulid = "3.0.0"
uuid = { version = "1.26.1", features = ["v4"] }

# Time handling
chrono = { version = "0.4.45", features = ["serde"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Environment variables
dotenvy = "0.15.7"

# Process execution
which = "8.0.6"

# Diff utilities
similar = "3.2.0"

# Async traits
async-trait = "0.1.92"

# Random number generation
rand = "0.10.3"

# Base64 encoding
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3.27.0"
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lib]
name = "link_assistant_agent"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/main.rs"

