paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # queue is documented syntax, newer than actionlint 1.7.12's schema.
      # Remove this exception when rhysd/actionlint#654 ships.
      - 'unexpected key "queue" for "concurrency" section'
      # GitHub's commit-bound self-repository syntax is newer than 1.7.12.
      # Remove after rhysd/actionlint#711 ships; scope to these exact local actions.
      - 'specifying action "\$/\.github/actions/(artifact|deploy-pages)" in invalid format because ref is missing'
