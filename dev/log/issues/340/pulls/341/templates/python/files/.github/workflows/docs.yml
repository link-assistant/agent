name: Docs

# Builds Sphinx documentation on every push and PR that touches docs/, src/, or
# this workflow. On pushes to main the rendered site is published to GitHub
# Pages only after deployment is explicitly enabled. PRs only build to verify
# the docs still compile.
#
# One-time setup: in the repository's Settings -> Pages, set Source to
# "GitHub Actions", then set the DEPLOY_GITHUB_PAGES repository variable to
# "true". Without the variable, deployment is skipped with a notice. Without
# Pages configured, the deploy step fails with HTTP 404, the request ID and a
# link to the Pages settings. See README.md "Deploying API documentation".
#
# The deploy job uses the local .github/actions/deploy-pages action (issue
# #130): the REST protocol of actions/deploy-pages@v5, plus bounded retries
# of a transient 5xx/429 from creating the deployment. Before each retry it
# looks the deployment up by commit SHA and adopts it unless it failed, so a
# commit is never deployed twice. It publishes exactly the artifact ID that
# the build job outputs.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
      - '.github/actions/deploy-pages/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
      - '.github/actions/deploy-pages/**'
  workflow_dispatch:

# Least-privilege default; the write scopes GitHub Pages needs are granted
# per job, to the two jobs that actually publish.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # actions/configure-pages enables the Pages site on push to main.
      pages: write
    outputs:
      # Empty unless the Pages artifact was uploaded; deploy only runs then.
      pages-artifact-id: ${{ steps.pages-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r docs/requirements.txt

      - name: Build Sphinx documentation
        run: sphinx-build -W --keep-going -b html docs _site

      - name: Upload build artifact
        uses: $/.github/actions/artifact
        with:
          name: docs-site
          path: _site
          if-no-files-found: error

      - name: Report skipped GitHub Pages deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES != 'true'
        run: echo "::notice::Skipping GitHub Pages deployment. To enable publishing, set Settings -> Pages -> Source = GitHub Actions, then add repository variable DEPLOY_GITHUB_PAGES=true."

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: $/.github/actions/artifact
        with:
          name: github-pages
          pages: true
          if-no-files-found: error
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_GITHUB_PAGES == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The deploy action publishes the artifact using an OIDC token.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: $/.github/actions/deploy-pages
        with:
          artifact_id: ${{ needs.build.outputs.pages-artifact-id }}

  # Terminal status gate (issue #69): GitHub reports jobs killed by
  # timeout-minutes as cancelled. Observe every other job so a timeout on main
  # becomes a visible failure instead of a grey run, while a run that was
  # superseded by a newer commit is recognised as expected churn.
  pipeline-status:
    name: Pipeline Status
    needs:
      - build
      - deploy
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
