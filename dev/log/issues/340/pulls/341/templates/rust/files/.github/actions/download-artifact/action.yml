name: Download and extract verified artifacts
description: Bypass v8's deprecated ZIP extractor while preserving digest verification
inputs:
  name:
    description: Artifact name (omit to use pattern or all artifacts)
    default: ''
  pattern:
    description: Artifact name pattern
    default: ''
  path:
    description: Destination directory
    required: true
  merge-multiple:
    description: Merge multiple artifacts into the destination
    default: 'false'
runs:
  using: composite
  steps:
    - name: Allocate raw download directory
      id: raw
      shell: bash
      run: echo "path=$(mktemp -d "$RUNNER_TEMP/artifact-raw.XXXXXX")" >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      env:
        NODE_OPTIONS: --throw-deprecation
      with:
        name: ${{ inputs.name }}
        pattern: ${{ inputs.pattern }}
        path: ${{ steps.raw.outputs.path }}
        merge-multiple: false
        skip-decompress: true
        digest-mismatch: error
    - name: Validate and extract ZIPs
      shell: bash
      env:
        RAW: ${{ steps.raw.outputs.path }}
        DESTINATION: ${{ inputs.path }}
        MERGE: ${{ inputs.merge-multiple }}
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: |
        args=()
        if [ "$MERGE" = true ]; then args+=(--merge-multiple); fi
        python3 "$ACTION_DIRECTORY/../../../scripts/extract-artifacts.py" "$RAW" "$DESTINATION" "${args[@]}"
