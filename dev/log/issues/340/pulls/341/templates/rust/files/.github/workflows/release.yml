name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
      bump_type:
        default: patch
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least-privilege default for every job; jobs that need more escalate explicitly.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  # Provide Git's initial branch before actions/checkout runs git init so
  # Git 2.54+ does not emit the upcoming Git 3.0 default-branch hint.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Harden Cargo registry index and crate downloads against transient network
  # flakes on GitHub-hosted runners, including curl HTTP/2 framing failures.
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  # The crates.io credentials are deliberately *not* declared here. A
  # workflow-level `env:` is inherited by every job, including the
  # `pull_request` jobs that compile and run branch code (`build.rs`, proc
  # macros, tests), so a workflow-level publish token is readable by any branch
  # pull request. They are declared on the two publish steps instead, which are
  # the only steps that need them.
  # Optional: set repository variable DOCKERHUB_IMAGE to namespace/image to publish Docker Hub releases.
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

# Concurrency is intentionally job-scoped. Each read-only job cancels only its
# superseded counterpart for the same non-main ref. Main checks are not
# cancelled, so a cancelled main job is always exceptional and the terminal
# status gate can safely report it as a failure. Jobs that can
# mutate repositories, registries, releases, or Pages all use one shared
# concurrency group instead. A write that has started is never cancelled, and
# GitHub queues up to 100 pending writers without replacing them.
jobs:
  javascript-first:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-javascript-first-caller
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    uses: ./.github/workflows/javascript-first-gate.yml # zizmor: ignore[self-repository]
    with:
      source-sha: ${{ github.sha }}

  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    needs: [javascript-first]
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (github.event_name != 'workflow_dispatch') }}
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: rust-script scripts/detect-code-changes.rs

  # === DOCS VALIDATION - required documents and their sections (issue #161) ===
  # A diff review reliably misses a deleted CONTRIBUTING.md or a gutted
  # README, and the link checker actually gets greener when the sections that
  # contained the links go away. scripts/check-required-docs.sh is the check;
  # the .md size limit half of principle 12 lives in
  # scripts/check-file-size.rs (runs in the lint job).
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-validate-docs
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes]
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (needs.detect-changes.outputs.docs-changed == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Check required documentation
        run: bash scripts/check-required-docs.sh

  # === RELEASE PREFLIGHT - prove the credentials can publish (issues #163, #167) ===
  # Principle 16: a non-empty secret proves nothing (an expired token is
  # non-empty), and a login proves authentication, not authorisation -- so
  # scripts/preflight-credentials.sh probes with an attempted write. In
  # release mode a refused credential fails the run here, before the matrix
  # spends a minute; in report mode (pull requests -- a fork has no
  # publishing secrets) the same probes annotate without blocking, which is
  # why the publishing jobs gate on `result == 'success'` rather than on the
  # run being green.
  release-preflight:
    if: needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha
    needs: [javascript-first]
    name: Release Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Probe every release credential
        env:
          PREFLIGHT_MODE: >-
            ${{
              (
                (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant')
              ) && 'release' || 'report'
            }}
          CRATES_PREFLIGHT_PHASE: availability
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: bash scripts/preflight-credentials.sh

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes]
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: rust-script scripts/check-changelog-fragment.rs

  # === VERSION CHECK - prevents manual version modification in PRs ===
  # This ensures versions are only modified by the automated release pipeline
  version-check:
    needs: [javascript-first]
    name: Version Modification Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-version-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (github.event_name == 'pull_request') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: rust-script scripts/check-version-modification.rs

  # === SECRETS SCAN ===
  # Language-agnostic credential scan with locked tooling and tracked evidence.
  secrets-scan:
    if: needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha
    needs: [javascript-first]
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-secrets-scan
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install locked secretlint
        # secretlint@13.0.7 and @secretlint/secretlint-rule-preset-recommend@13.0.7
        run: npm ci --prefix .github/secretlint --ignore-scripts --no-audit --no-fund

      - name: Test tracked evidence scanner
        run: node --test .github/scripts/check-secrets.test.mjs

      - name: Run secretlint on tracked evidence
        run: node .github/scripts/check-secrets.mjs

  # === FRESH MERGE SIMULATION ===
  # Catches semantic merge conflicts: a pull request that is green in isolation but
  # breaks the base branch once merged into its current tip.
  fresh-merge:
    name: Fresh Merge Simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-fresh-merge
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes]
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fresh-merge-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fresh-merge-

      - name: Simulate fresh merge with base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          FRESH_MERGE_BUDGET_SECONDS: 1200
        run: >-
          bash scripts/run-with-budget-warning.sh "$FRESH_MERGE_BUDGET_SECONDS" "Fresh merge simulation"
          bash scripts/simulate-fresh-merge.sh

  # === DOCKER IMAGE BUILD CHECK ===
  # Builds the image at pull-request stage without pushing, so a Dockerfile
  # regression fails the pull request instead of producing a half-finished release
  # (crate published, image missing). push: false also works for fork pull requests
  # that have no registry credentials.
  docker-build:
    name: Docker Image Build Check
    runs-on: ubuntu-24.04
    # The image compiles the crate from scratch; 30 minutes is not enough cold.
    # The build step is a `uses:` action, so it cannot be wrapped in
    # scripts/run-with-budget-warning.sh; docker/build-push-action owns its own
    # process and there is no shell command to budget. This job is therefore an
    # accepted exemption from the budget invariant (see tests/unit/ci-cd/issue_135.rs).
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes]
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (!cancelled() && (github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.any-code-changed == 'true')) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile at repository root; skipping image build check."
          fi

      - name: Set up Docker Buildx
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        if: steps.dockerfile.outputs.exists == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: app:pr-check
          # An explicit scope keeps this build's layers separate from the
          # release publication builds: unscoped GHA caches share the single
          # default `buildkit` key and overwrite each other.
          cache-from: type=gha,scope=docker-image
          cache-to: type=gha,mode=max,scope=docker-image

  # === CARGO.LOCK GUARD ===
  # Binary crates must commit Cargo.lock so CI and release jobs resolve the same
  # dependency graph every run. This also prevents cache keys based on
  # hashFiles('**/Cargo.lock') from silently degrading to the empty hash.
  cargo-lock:
    name: Cargo.lock Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cargo-lock
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes]
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Check committed Cargo.lock for binary crates
        run: rust-script scripts/check-cargo-lock.rs

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changelog check - it's a fast check that should always run
  # See: https://github.com/link-assistant/hive-mind/pull/1024 for why this dependency was removed
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes, cargo-lock]
    # Note: !cancelled() is required because detect-changes is skipped on workflow_dispatch,
    # and without it, this job would also be skipped even though its condition includes workflow_dispatch.
    # See: https://github.com/actions/runner/issues/491
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() && (
        needs.cargo-lock.result == 'success' && (
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.rs-changed == 'true' ||
          needs.detect-changes.outputs.toml-changed == 'true' ||
          needs.detect-changes.outputs.workflow-changed == 'true' ||
          needs.detect-changes.outputs.any-code-changed == 'true'
        )
      )
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable
          components: rustfmt, clippy

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Fail on Cargo manifest warnings
        run: bash scripts/check-cargo-warnings.sh

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features

      # Warning-band annotations are limited to files this pull request changed,
      # so unchanged files stop repeating the same warning on every run.
      # The 1000-line hard limit still applies to the whole repository.
      - name: Collect changed files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          {
            echo 'files<<CHANGED_FILES_EOF'
            if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              git diff --name-only "$BASE_SHA" HEAD
            else
              # No usable base (e.g. workflow_dispatch): fall back to annotating every warning.
              git ls-files
            fi
            echo 'CHANGED_FILES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build documentation
        # Fail-closed rustdoc gate: rustdoc-only lints (for example
        # rustdoc::private_intra_doc_links) are not reported by clippy or
        # doc tests, so they must be caught here, before release,
        # instead of in the post-release deploy-docs job.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Check file size limit
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: rust-script scripts/check-file-size.rs

  # === TEST ===
  # Test runs independently of changelog check and only for code-affecting changes
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Backstop only. The budgeted steps below own the real deadline; see
    # scripts/run-with-budget-warning.sh for why that distinction matters.
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes, cargo-lock]
    # Note: !cancelled() is required because detect-changes is skipped on workflow_dispatch,
    # and without it, this job would also be skipped even though its condition includes workflow_dispatch.
    # See: https://github.com/actions/runner/issues/491
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() && (
        needs.cargo-lock.result == 'success' && (
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.any-code-changed == 'true' ||
          needs.detect-changes.outputs.rs-changed == 'true' ||
          needs.detect-changes.outputs.toml-changed == 'true' ||
          needs.detect-changes.outputs.workflow-changed == 'true'
        )
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Cache cargo registry on Windows
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-test-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-registry-

      - name: Cache cargo registry and target on Unix
        if: runner.os != 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      # cargo test includes doc tests with the same feature set.
      - name: Run tests
        shell: bash
        env:
          TEST_BUDGET_SECONDS: 900
        run: >-
          bash scripts/run-with-budget-warning.sh "$TEST_BUDGET_SECONDS" "Test suite"
          cargo test --all-features --verbose

  # === RELEASE SCRIPT TESTS ===
  # `cargo test` only builds the library crate, so the inline `#[cfg(test)]`
  # suites in scripts/*.rs — including the regression guard on
  # rebase-before-stage ordering in version-and-commit.rs — never execute
  # unless a job runs `rust-script --test` on them explicitly.
  script-tests:
    name: Release Script Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-script-tests
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes, cargo-lock]
    # Note: !cancelled() is required because detect-changes is skipped on workflow_dispatch,
    # and without it, this job would also be skipped even though its condition includes workflow_dispatch.
    # See: https://github.com/actions/runner/issues/491
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() && (
        needs.cargo-lock.result == 'success' && (
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.any-code-changed == 'true' ||
          needs.detect-changes.outputs.rs-changed == 'true' ||
          needs.detect-changes.outputs.toml-changed == 'true' ||
          needs.detect-changes.outputs.workflow-changed == 'true'
        )
      )
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-script-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-script-tests-

      - name: Run release script unit tests
        # Every script carrying a `#[cfg(test)]` module is built as its own test
        # harness. Failures are collected rather than short-circuited so one
        # broken suite does not hide the state of the others.
        run: bash scripts/test-scripts.sh

  # === CODE COVERAGE ===
  # Generate and upload code coverage using cargo-llvm-cov
  coverage:
    name: Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-coverage
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, detect-changes, cargo-lock]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() && (
        needs.cargo-lock.result == 'success' && (
          github.event_name == 'workflow_dispatch' ||
          needs.detect-changes.outputs.rs-changed == 'true' ||
          needs.detect-changes.outputs.toml-changed == 'true'
        )
      )
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          # The `cargo-llvm-cov` ref is what supplied the tool name; once
          # pinned to a hash the input has to be restated explicitly.
          tool: cargo-llvm-cov

      - name: Generate code coverage
        env:
          COVERAGE_BUDGET_SECONDS: 600
        run: >-
          bash scripts/run-with-budget-warning.sh "$COVERAGE_BUDGET_SECONDS" "Code coverage"
          cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true

      - name: Report skipped Codecov upload
        if: env.CODECOV_TOKEN == ''
        run: echo "::notice::Skipping Codecov upload because CODECOV_TOKEN is not configured"

  # === BUILD ===
  # Build package - only runs if lint and test pass
  build:
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [javascript-first, lint, test, script-tests]
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (!cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.script-tests.result == 'success') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: cargo build --release --verbose

      - name: Check package
        run: cargo package --list --allow-dirty

      - name: Check crate package size
        run: rust-script scripts/check-crate-size.rs

  # === AUTO RELEASE ===
  # Automatic release on push to main using changelog fragments
  # This job automatically bumps version based on fragments in changelog.d/
  auto-release:
    name: Auto Release
    needs: [javascript-first, lint, test, build, coverage, docker-build, validate-docs, changelog, secrets-scan, version-check, fresh-merge, release-preflight]
    outputs:
      docker_enabled: ${{ steps.dockerhub.outputs.enabled }}
      release_version: ${{ steps.release-metadata.outputs.version }}
      tested-sha: ${{ steps.candidate.outputs.sha }}
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    # Note: !cancelled() ensures consistent behavior with other jobs that depend on skipped jobs.
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.release-preflight.result == 'success' &&
      needs.build.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    # Covers the crate build, publish, smoke test, and a cold Docker build.
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      id-token: write
    steps:
      # This job pushes the version bump commit and tag back to `main`, so the
      # checkout explicitly persists credentials for these serialized writers.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Attach writer branch at the tested revision
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          TESTED_SHA: ${{ needs.javascript-first.outputs.tested-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git switch -C "$RELEASE_BRANCH" "$TESTED_SHA"
          git branch --set-upstream-to="origin/$RELEASE_BRANCH" "$RELEASE_BRANCH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Configure git
        run: rust-script scripts/git-config.rs

      - name: Determine bump type from changelog fragments
        id: bump_type
        run: rust-script scripts/get-bump-type.rs

      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: rust-script scripts/check-release-needed.rs

      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        continue-on-error: true # Existing repositories may still need token fallback.
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'

      - name: Verify selected publishing credential
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        env:
          PREFLIGHT_MODE: release
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: bash scripts/preflight-credentials.sh

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.bump_type }}
        run: |
          rust-script scripts/version-and-commit.rs \
            --bump-type "$BUMP_TYPE"

      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        run: rust-script scripts/get-version.rs

      - name: Validate generated release candidate
        id: candidate
        if: steps.check.outputs.should_release == 'true'
        env:
          JAVASCRIPT_BUDGET_SECONDS: 1200
        run: EXPECTED_SHA="$(git rev-parse HEAD)" bash scripts/run-with-budget-warning.sh "$JAVASCRIPT_BUDGET_SECONDS" "Release candidate prerequisite" node scripts/run-javascript-first-auto.mjs

      - name: Build release
        if: steps.check.outputs.should_release == 'true'
        run: cargo build --release

      - name: Check crate package size
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        run: rust-script scripts/check-crate-size.rs

      - name: Publish to Crates.io
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.crate_published != 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs

      - name: Wait for Crate availability on Crates.io
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          RELEASE_VERSION: ${{ steps.current_version.outputs.version }}
        run: rust-script scripts/wait-for-crate.rs --release-version "$RELEASE_VERSION"

      - name: Smoke-test published crate
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          RELEASE_VERSION: ${{ steps.current_version.outputs.version }}
        run: rust-script scripts/smoke-test-published-crate.rs --release-version "$RELEASE_VERSION"

      - name: Configure Docker Hub publishing
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        id: dockerhub
        run: |
          disable_dockerhub() {
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "$1"
          }

          if [ -z "$DOCKERHUB_IMAGE" ]; then
            disable_dockerhub "Docker Hub publishing disabled: DOCKERHUB_IMAGE repository variable is not set"
            exit 0
          fi

          if [ ! -f Dockerfile ]; then
            disable_dockerhub "Docker Hub publishing disabled: Dockerfile was not found at repository root"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "docker_hub_url=https://hub.docker.com/r/${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: release-metadata
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          CURRENT_VERSION: ${{ steps.current_version.outputs.version }}
        run: |
          release_version="$NEW_VERSION"
          if [ -z "$release_version" ]; then
            release_version="$CURRENT_VERSION"
          fi
          echo "version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: |
          steps.check.outputs.should_release == 'true' && (
            steps.check.outputs.crate_published == 'true' ||
            steps.publish-crate.outputs.publish_result == 'success'
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_HUB_URL: ${{ steps.dockerhub.outputs.docker_hub_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
        run: |
          release_args=(
            --release-version "$RELEASE_VERSION"
            --repository "$REPOSITORY"
          )
          if [ -n "$DOCKER_HUB_URL" ]; then
            release_args+=(--docker-hub-url "$DOCKER_HUB_URL")
          fi
          rust-script scripts/create-github-release.rs "${release_args[@]}"

  # === MANUAL INSTANT RELEASE ===
  # Manual release via workflow_dispatch - only after CI passes
  manual-release:
    name: Instant Release
    needs: [javascript-first, lint, test, build, coverage, docker-build, validate-docs, changelog, secrets-scan, version-check, fresh-merge, release-preflight]
    outputs:
      docker_enabled: ${{ steps.dockerhub.outputs.enabled }}
      release_version: ${{ steps.version.outputs.new_version }}
      tested-sha: ${{ steps.candidate.outputs.sha }}
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    # Note: !cancelled() is required to evaluate the condition when dependencies may be skipped.
    # The build job ensures lint and test passed before this job runs.
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.release-preflight.result == 'success' &&
      needs.build.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    # Covers the crate build, publish, smoke test, and a cold Docker build.
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: write
      id-token: write
    steps:
      # This job pushes the version bump commit and tag back to `main`, so the
      # checkout explicitly persists credentials for these serialized writers.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Attach writer branch at the tested revision
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          TESTED_SHA: ${{ needs.javascript-first.outputs.tested-sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_SHA"
          git switch -C "$RELEASE_BRANCH" "$TESTED_SHA"
          git branch --set-upstream-to="origin/$RELEASE_BRANCH" "$RELEASE_BRANCH"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Configure git
        run: rust-script scripts/git-config.rs

      - name: Authenticate with crates.io (trusted publishing)
        id: crates_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        continue-on-error: true # Existing repositories may still need token fallback.

      - name: Verify selected publishing credential
        env:
          PREFLIGHT_MODE: release
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: bash scripts/preflight-credentials.sh

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/version-and-commit.rs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Validate generated release candidate
        id: candidate
        env:
          JAVASCRIPT_BUDGET_SECONDS: 1200
        run: EXPECTED_SHA="$(git rev-parse HEAD)" bash scripts/run-with-budget-warning.sh "$JAVASCRIPT_BUDGET_SECONDS" "Release candidate prerequisite" node scripts/run-javascript-first-auto.mjs

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: cargo build --release

      - name: Check crate package size
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: rust-script scripts/check-crate-size.rs

      - name: Publish to Crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: rust-script scripts/publish-crate.rs

      - name: Wait for Crate availability on Crates.io
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: rust-script scripts/wait-for-crate.rs --release-version "$RELEASE_VERSION"

      - name: Smoke-test published crate
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: rust-script scripts/smoke-test-published-crate.rs --release-version "$RELEASE_VERSION"

      - name: Configure Docker Hub publishing
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        id: dockerhub
        run: |
          disable_dockerhub() {
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "$1"
          }

          if [ -z "$DOCKERHUB_IMAGE" ]; then
            disable_dockerhub "Docker Hub publishing disabled: DOCKERHUB_IMAGE repository variable is not set"
            exit 0
          fi

          if [ ! -f Dockerfile ]; then
            disable_dockerhub "Docker Hub publishing disabled: Dockerfile was not found at repository root"
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "docker_hub_url=https://hub.docker.com/r/${DOCKERHUB_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: |
          (steps.version.outputs.version_committed == 'true' ||
            steps.version.outputs.already_released == 'true') &&
          steps.publish-crate.outputs.publish_result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_HUB_URL: ${{ steps.dockerhub.outputs.docker_hub_url }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          release_args=(
            --release-version "$RELEASE_VERSION"
            --repository "$REPOSITORY"
          )
          if [ -n "$DOCKER_HUB_URL" ]; then
            release_args+=(--docker-hub-url "$DOCKER_HUB_URL")
          fi
          rust-script scripts/create-github-release.rs "${release_args[@]}"

  # Build each architecture on a native runner. Publishing by digest lets both
  # builds run in parallel without racing to update a shared image tag.
  release-javascript-first:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-release-javascript-first-caller
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [auto-release, manual-release]
    if: ${{ !cancelled() && (needs.auto-release.outputs.tested-sha != '' || needs.manual-release.outputs.tested-sha != '') }}
    uses: ./.github/workflows/javascript-first-gate.yml # zizmor: ignore[self-repository]
    with:
      source-sha: ${{ needs.auto-release.outputs.tested-sha || needs.manual-release.outputs.tested-sha }}

  docker-publish:
    name: Publish Docker / ${{ matrix.platform }}
    needs: [release-javascript-first, auto-release, manual-release, release-preflight]
    if: |
      needs.release-javascript-first.result == 'success' &&
      !cancelled() &&
      needs.release-preflight.result == 'success' &&
      (needs.auto-release.result == 'success' || needs.manual-release.result == 'success') &&
      (needs.auto-release.outputs.docker_enabled == 'true' || needs.manual-release.outputs.docker_enabled == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.auto-release.outputs.release_version || needs.manual-release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ env.RELEASE_VERSION }}
          persist-credentials: false

      - name: Verify prerequisite revision
        env:
          TESTED_SHA: ${{ needs.release-javascript-first.outputs.tested-sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        # The `$/` self-repository form zizmor prefers is rejected by actionlint
        # 1.7.7 ("ref is missing"), which also gates this repository; switch once
        # actionlint understands the July 2026 syntax.
        uses: ./.github/actions/setup-buildx-resilient # zizmor: ignore[self-repository]

      - name: Build and push architecture digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: org.opencontainers.image.version=${{ env.RELEASE_VERSION }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The two matrix legs must not overwrite each other's exported
          # layers: unscoped GHA caches share the single default `buildkit`
          # key, so the second build evicts the first's cache.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          digest="$BUILD_DIGEST"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-merge-manifest:
    name: Publish Docker manifest
    needs: [javascript-first, auto-release, manual-release, docker-publish, release-preflight]
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() &&
      needs.release-preflight.result == 'success' &&
      needs.docker-publish.result == 'success'
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RELEASE_VERSION: ${{ needs.auto-release.outputs.release_version || needs.manual-release.outputs.release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Download digests
        # actionlint 1.7.12 rejects $/; the adapter reads the checked-out scripts.
        uses: ./.github/actions/download-artifact # zizmor: ignore[self-repository]
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create multi-architecture manifest
        working-directory: /tmp/digests
        run: |
          mapfile -t digests < <(printf "${DOCKERHUB_IMAGE}@sha256:%s\n" *)
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            --tag "${DOCKERHUB_IMAGE}:${RELEASE_VERSION}" \
            "${digests[@]}"

      - name: Verify manifest platforms
        run: |
          manifest="$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${RELEASE_VERSION}")"
          grep -F 'linux/amd64' <<< "$manifest"
          grep -F 'linux/arm64' <<< "$manifest"

  # === MANUAL CHANGELOG PR ===
  changelog-pr:
    needs: [javascript-first]
    name: Create Changelog PR
    if: ${{ needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha && (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require a release PR credential that triggers CI
        env:
          RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_PR_TOKEN" ]; then
            echo "::error::Set RELEASE_PR_TOKEN to a GitHub App or fine-grained token with Contents and Pull requests write permissions. GITHUB_TOKEN-created PRs require workflow approval."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Install rust-script
        run: ./scripts/install-rust-script.sh

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: rust-script scripts/create-changelog-fragment.rs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release

  # === DEPLOY DOCUMENTATION ===
  # Deploy Rust API documentation to GitHub Pages after a successful package build.
  # Keep this independent from package/GitHub release publication so the website
  # still updates when the release path fails. Use the official Pages artifact
  # deployment path so repositories configured with "GitHub Actions" as their
  # Pages source fail this job if Pages cannot deploy.
  #
  # One-time setup: in the repository's Settings -> Pages, set Source to
  # "GitHub Actions". Without this, the first run fails on actions/deploy-pages
  # with "Get Pages site failed" / "Failed to create deployment". This cannot be
  # configured from a workflow. See README.md "Deploying API documentation".
  deploy-docs:
    name: Deploy Rust Documentation
    needs: [javascript-first, build]
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    if: |
      needs.javascript-first.result == 'success' && needs.javascript-first.outputs.tested-sha == github.sha &&
      !cancelled() &&
      needs.build.result == 'success' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'instant')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.javascript-first.outputs.tested-sha == github.sha && github.sha }}
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # safely handle action inputs (#187)
        with:
          # The `stable` ref is what supplied the action's default toolchain;
          # once pinned to a hash the input has to be restated explicitly.
          toolchain: stable

      - name: Build documentation
        # Defense in depth: same fail-closed flags as the lint job's gate.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Generate Pages root index
        run: |
          # rustdoc emits target/doc/<crate>/index.html but no root index.html,
          # which makes the GitHub Pages root URL return 404. Redirect the root
          # to the crate docs directory that rustdoc generated.
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["name"].replace("-","_"))')
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=%s/index.html">\n' "$crate" \
            > target/doc/index.html
          touch target/doc/.nojekyll

      - name: Add desktop download page
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p target/doc/download
          sed "s#__REPOSITORY__#$REPOSITORY#g" \
            docs/download/index.html > target/doc/download/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Verify site tree
        run: find target/doc -maxdepth 2 -print

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # Remove when actions/deploy-pages#434 ships; retain every other warning.
        env:
          NODE_OPTIONS: --disable-warning=DEP0040

  # === PIPELINE STATUS ===
  # GitHub reports jobs killed by timeout-minutes as cancelled. Observe every
  # job so a timeout on main becomes a visible failure instead of a grey run.
  pipeline-status:
    name: Pipeline Status
    needs:
      - javascript-first
      - detect-changes
      - validate-docs
      - release-preflight
      - changelog
      - version-check
      - secrets-scan
      - fresh-merge
      - docker-build
      - cargo-lock
      - lint
      - test
      - script-tests
      - coverage
      - build
      - release-javascript-first
      - auto-release
      - manual-release
      - docker-publish
      - docker-merge-manifest
      - changelog-pr
      - deploy-docs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read this run's jobs and annotations to name runner-acquisition failures (issue #226).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          # Used to tell a cancelled-but-superseded run (expected churn) from a
          # cancelled run that was still the branch head (a hidden timeout).
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
