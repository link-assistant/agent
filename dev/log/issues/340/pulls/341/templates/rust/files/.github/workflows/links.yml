name: Broken Link Checker

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - '**.html'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
      - 'lychee.toml'
      - 'scripts/check-web-archive.mjs'
      - 'scripts/check-web-archive.test.mjs'
      - 'scripts/recheck-broken-links.mjs'
      - 'scripts/recheck-broken-links.test.mjs'
      - 'scripts/fixtures/lychee-report.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.html'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
      - 'lychee.toml'
      - 'scripts/check-web-archive.mjs'
      - 'scripts/check-web-archive.test.mjs'
      - 'scripts/recheck-broken-links.mjs'
      - 'scripts/recheck-broken-links.test.mjs'
      - 'scripts/fixtures/lychee-report.md'
  workflow_dispatch:

# Least-privilege default; jobs escalate individually when needed.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  link-checker:
    name: Check Links
    runs-on: ubuntu-24.04
    # Typical run: <1min with lychee cache. 10min prevents slow
    # external hosts or Wayback Machine probes from hanging the workflow.
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-link-checker
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test Web Archive report parser
        run: node --test scripts/check-web-archive.test.mjs

      - name: Test link re-check
        run: node --test scripts/recheck-broken-links.test.mjs

      - name: Restore lychee cache
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ runner.os }}-${{ github.run_id }}
          restore-keys: lychee-${{ runner.os }}-

      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Check all Markdown and HTML files
          # Exclude case-studies directory - these are research documents from
          # external repos with references to files and issues that don't exist
          # in this repository (similar exclusion pattern as eslint.config.js)
          args: >-
            --verbose
            --no-progress
            --cache
            --max-cache-age 1d
            --max-retries 3
            --timeout 30
            --exclude-path docs/case-studies
            --exclude-path scripts/fixtures
            './**/*.md'
            './**/*.html'
          # Don't fail the workflow immediately - we want to check web archive first
          fail: false
          # Output file for broken links report (used by check-web-archive.mjs)
          output: lychee/out.md
          # Write a job summary
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Re-check unanswered and transient links
        # --max-retries never retries a failure during the connect phase
        # (lycheeverse/lychee#2297), so a healthy URL behind a connection
        # reset is reported broken without one retry. Ask those URLs again
        # outside lychee. Rejected 5xx responses are also never retried by
        # lychee; retry them and 429 here while keeping 404 final.
        if: steps.lychee.outputs.exit_code != 0
        id: recheck
        run: node scripts/recheck-broken-links.mjs
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          LYCHEE_OUTPUT: lychee/out.md
          RECOVERED_OUTPUT: lychee/recovered.txt

      - name: Check broken links against Web Archive
        # `!= 'true'`, never `== 'false'`: a skipped re-check leaves the
        # output empty, and only the != form fails safe.
        if: >-
          steps.lychee.outputs.exit_code != 0 &&
          steps.recheck.outputs.all_recovered != 'true'
        id: webarchive
        run: node scripts/check-web-archive.mjs
        env:
          LYCHEE_EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
          LYCHEE_OUTPUT: lychee/out.md
          RECOVERED_URLS: lychee/recovered.txt

      - name: Upload broken link report
        if: ${{ !cancelled() && steps.lychee.outputs.exit_code != 0 }}
        uses: actions/upload-artifact@v7
        with:
          name: broken-links
          path: lychee/
          retention-days: 7
          if-no-files-found: error

      - name: Fail if broken links were found
        if: >-
          always() &&
          steps.lychee.outputs.exit_code != 0 &&
          steps.recheck.outputs.all_recovered != 'true'
        run: |
          echo "::error::Broken live links were detected."
          echo ""
          echo "What happened:"
          echo "  lychee found one or more broken links in the *.md and *.html files of this repository."
          echo "  A Web Archive snapshot is a suggested replacement; it does not fix the broken source link."
          echo ""
          echo "How to fix:"
          echo "  1. Review the 'Check links with lychee' step above for a full list of broken links."
          echo "  2. Review the Web Archive step when it ran. For links marked with a '::notice::' annotation,"
          echo "     a Web Archive version exists."
          echo "     Replace those broken links with the suggested archive.org URL."
          echo "  3. For links with no archive version, either:"
          echo "     a. Find an updated URL that points to the same or equivalent content."
          echo "     b. Remove the link if the content is no longer relevant."
          echo "     c. Add the URL to .lycheeignore if it is a known false positive."
          echo ""
          echo "Report location: lychee/out.md (available as the broken-links workflow artifact)."
          exit 1

  # Terminal status gate (issue #156): GitHub reports jobs killed by
  # timeout-minutes as cancelled. Observe every other job so a timeout on main
  # becomes a visible failure instead of a grey run, while a run that was
  # superseded by a newer commit is recognised as expected churn.
  pipeline-status:
    name: Pipeline Status
    needs:
      - link-checker
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Read this run's jobs and annotations to name runner-acquisition failures (issue #226).
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
