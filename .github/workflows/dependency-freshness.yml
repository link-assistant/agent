name: Dependency Freshness

on:
  push:
    branches: [main]
    paths:
      - 'scripts/check-pipeline-status.sh'
      - 'scripts/job-cancel-policy.mjs'
      - 'scripts/*freshness*.mjs'
      - 'js/tests/dependency-freshness.js'
      - 'js/package.json'
      - 'js/package-lock.json'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/dependency-freshness.yml'
  pull_request:
    paths:
      - 'scripts/check-pipeline-status.sh'
      - 'scripts/job-cancel-policy.mjs'
      - 'scripts/*freshness*.mjs'
      - 'js/tests/dependency-freshness.js'
      - 'js/package.json'
      - 'js/package-lock.json'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/dependency-freshness.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  npm-outdated:
    name: npm outdated
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-outdated
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install dependencies from the committed lockfile
        working-directory: js
        run: npm ci --legacy-peer-deps --ignore-scripts
      - name: Check direct dependencies against their latest releases
        working-directory: js
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node ../scripts/check-npm-freshness.mjs

  cargo-outdated:
    name: cargo outdated
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-cargo-outdated
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      # install-action (up to v2.87.30) ships no cargo-outdated manifest, so
      # its "updating install-action might resolve this" info line is
      # expected: the tool is always installed through cargo-binstall.
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-outdated@0.19.0
          fallback: cargo-binstall
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - name: Check direct dependencies against their latest releases
        working-directory: rust
        run: node ../scripts/check-cargo-freshness.mjs

  # GitHub reports a job killed by timeout-minutes as cancelled, which leaves
  # the run grey instead of red. This gate fails the run on any unsuccessful
  # job and on any cancellation a newer run does not explain (#301, #337).
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    if: always()
    needs:
      - npm-outdated
      - cargo-outdated
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
