name: Workflows

# Lints the workflow files themselves. Without this, shell bugs inside `run:`
# blocks and unpinned/injectable action usage only surface as production CI
# failures (issue #301).
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/check-pipeline-status.sh'
      - 'scripts/job-cancel-policy.mjs'
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'scripts/check-version.mjs'
      - 'scripts/pr-comparison.mjs'
      - 'scripts/validate-docs.mjs'
      - '**.md'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/check-pipeline-status.sh'
      - 'scripts/job-cancel-policy.mjs'
      - '.github/workflows/**'
      - '.github/zizmor.yml'
      - 'scripts/check-version.mjs'
      - 'scripts/pr-comparison.mjs'
      - 'scripts/validate-docs.mjs'
      - '**.md'
  workflow_dispatch:

# Least-privilege default; these jobs only need to read the checked-out tree.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this also lints
      # every `run:` block. A native actionlint binary without shellcheck on
      # PATH silently skips the shell checks and exits 0 - worth knowing when
      # reproducing a failure locally:
      #   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          # actionlint 1.7.12 predates concurrency.queue (upstream #657).
          # workflow-policy.js validates the key, value and writer placement.
          args: >-
            -color -ignore 'unexpected key "queue" for "concurrency" section'

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Annotations instead of SARIF: code scanning is not guaranteed to be
      # enabled on every fork, and the job should fail loudly either way.
      - uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          min-confidence: medium

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-repository-policy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - name: Guard CI-managed package versions
        if: github.event_name == 'pull_request'
        run: node scripts/check-version.mjs
      - name: Validate documentation
        run: node scripts/validate-docs.mjs

  # GitHub reports a job killed by timeout-minutes as cancelled, which leaves
  # the run grey instead of red. This gate fails the run on any unsuccessful
  # job and on any cancellation a newer run does not explain (#301, #337).
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    if: always()
    needs:
      - repository-policy
      - actionlint
      - zizmor
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
