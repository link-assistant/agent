name: Model Catalogue

on:
  push:
    branches: [main]
    paths:
      - 'js/src/config/defaults.ts'
      - 'rust/src/defaults.rs'
      - 'scripts/check-default-models.mjs'
      - 'js/tests/default-model-catalogue.ts'
      - '.github/workflows/model-catalogue.yml'
  pull_request:
    paths:
      - 'js/src/config/defaults.ts'
      - 'rust/src/defaults.rs'
      - 'scripts/check-default-models.mjs'
      - 'js/tests/default-model-catalogue.ts'
      - '.github/workflows/model-catalogue.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  defaults:
    name: Default model availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-defaults
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      # The checker and these tests import only dependency-free defaults.
      - name: Test catalogue validation and Rust parity
        run: bun test ./js/tests/default-model-catalogue.ts
      - name: Validate shipped models against live catalogues
        run: bun scripts/check-default-models.mjs
