name: Model Tests

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model (from dropdown)'
        required: true
        type: choice
        default: 'groq/llama-3.3-70b-versatile'
        options:
          # Groq models (sorted alphabetically)
          - groq/deepseek-r1-distill-llama-70b
          - groq/gemma2-9b-it
          - groq/llama-3.1-8b-instant
          - groq/llama-3.3-70b-versatile
          - groq/llama-guard-3-8b
          - groq/llama3-70b-8192
          - groq/llama3-8b-8192
          - groq/meta-llama/llama-4-maverick-17b-128e-instruct
          - groq/meta-llama/llama-4-scout-17b-16e-instruct
          - groq/meta-llama/llama-guard-4-12b
          - groq/mistral-saba-24b
          - groq/moonshotai/kimi-k2-instruct
          - groq/moonshotai/kimi-k2-instruct-0905
          - groq/openai/gpt-oss-120b
          - groq/openai/gpt-oss-20b
          - groq/qwen-qwq-32b
          - groq/qwen/qwen3-32b
          # Maintained Kilo free aliases (authentication recommended)
          - kilo/nemotron-3-super-free
          - kilo/nemotron-3-ultra-free
          - kilo/nemotron-3.5-lightning-free
          # OpenCode models (sorted alphabetically)
          - opencode/alpha-doubao-seed-code
          - opencode/alpha-gd4
          - opencode/alpha-minimax-m2
          - opencode/big-pickle
          - opencode/claude-3-5-haiku
          - opencode/claude-haiku-4-5
          - opencode/claude-opus-4-1
          - opencode/claude-opus-4-5
          - opencode/claude-sonnet-4
          - opencode/claude-sonnet-4-5
          - opencode/gemini-3-pro
          - opencode/glm-4.6
          - opencode/gpt-5
          - opencode/gpt-5-codex
          - opencode/gpt-5-nano
          - opencode/gpt-5.1
          - opencode/gpt-5.1-codex
          - opencode/gpt-5.1-codex-max
          - opencode/grok-code
          - opencode/kimi-k2
          - opencode/kimi-k2-thinking
          - opencode/qwen3-coder
      custom_model:
        description: 'Custom model name in provider/model format (overrides dropdown if set)'
        required: false
        type: string
        default: ''
      test_type:
        description: 'Test Type'
        required: true
        type: choice
        default: 'both'
        options:
          - with_tools
          - without_tools
          - both

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

env:
  # actions/checkout runs `git init` before any repository config exists, which
  # prints a hint about the default branch name on every job. Setting it via
  # GIT_CONFIG_* silences the hint without an extra step.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  test-model:
    name: Test Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-model-${{ inputs.model }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: js

      - name: Determine model to test
        id: model
        # custom_model is a free-form string. Interpolating `${{ inputs.* }}`
        # into the script substitutes it before the shell runs, so a value
        # containing shell metacharacters would be executed as code. Passing it
        # through env keeps it as data.
        env:
          CUSTOM_MODEL: ${{ inputs.custom_model }}
          MODEL_FROM_DROPDOWN: ${{ inputs.model }}
        run: |
          if [ -n "$CUSTOM_MODEL" ]; then
            MODEL_ID="$CUSTOM_MODEL"
          else
            MODEL_ID="$MODEL_FROM_DROPDOWN"
          fi

          # Extract provider and model name from provider/model format
          PROVIDER=${MODEL_ID%%/*}
          MODEL_NAME=${MODEL_ID#*/}

          if [ "$PROVIDER" = "$MODEL_ID" ] || [ -z "$MODEL_NAME" ]; then
            echo "::error::Model must be in provider/model format, got: $MODEL_ID"
            exit 1
          fi

          {
            echo "model_id=$MODEL_ID"
            echo "model_name=$MODEL_NAME"
            echo "provider=$PROVIDER"
          } >> "$GITHUB_OUTPUT"
          echo "Testing model: $MODEL_ID (provider: $PROVIDER, model: $MODEL_NAME)"

      - name: Fetch model capabilities
        id: capabilities
        env:
          PROVIDER: ${{ steps.model.outputs.provider }}
          MODEL_NAME: ${{ steps.model.outputs.model_name }}
        run: |
          OUTPUT=$(node scripts/get-model-info.mjs "$PROVIDER" "$MODEL_NAME")
          echo "$OUTPUT"
          # Only well-formed key=value lines may reach $GITHUB_OUTPUT. Any other
          # line makes the runner fail the step with "Invalid format", and a
          # line containing `=` in an unexpected place could inject an output.
          echo "$OUTPUT" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=[^[:cntrl:]]*$' >> "$GITHUB_OUTPUT" || true

      # Groq rejects every request without a key, so a missing secret fails
      # here with its name instead of as an opaque test failure. Kilo serves
      # its free models anonymously but may reject them, hence only a warning.
      - name: Check API key availability
        env:
          PROVIDER: ${{ steps.model.outputs.provider }}
        run: |
          case "$PROVIDER" in
            groq)
              if [ -z "$GROQ_API_KEY" ]; then
                echo "::error::GROQ_API_KEY is not set. Add it as a repository secret to test Groq models."
                exit 1
              fi
              echo "GROQ_API_KEY is configured"
              ;;
            kilo)
              if [ -z "$KILO_API_KEY" ]; then
                echo "::warning::KILO_API_KEY is not set. Kilo models are tested anonymously, which Kilo may reject."
              else
                echo "KILO_API_KEY is configured"
              fi
              ;;
          esac

      - name: Test without tools (simple response)
        if: inputs.test_type == 'without_tools' || inputs.test_type == 'both'
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: node scripts/test-model-simple.mjs "$MODEL_ID"

      - name: Test with tools (tool calling)
        if: inputs.test_type == 'with_tools' || inputs.test_type == 'both'
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
        run: node scripts/test-model-tools.mjs "$MODEL_ID"

      - name: Summary
        # The summary is most useful when a test failed, so it must not be
        # skipped by the failure of a previous step.
        if: ${{ !cancelled() }}
        env:
          MODEL_ID: ${{ steps.model.outputs.model_id }}
          PROVIDER: ${{ steps.model.outputs.provider }}
          TEST_TYPE: ${{ inputs.test_type }}
        run: |
          {
            echo "## Model Test Summary"
            echo ""
            echo "- **Model**: $MODEL_ID"
            echo "- **Provider**: $PROVIDER"
            echo "- **Test Type**: $TEST_TYPE"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-output-simple.log ]; then
            {
              echo "### Simple Test Output"
              echo '```'
              head -50 test-output-simple.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -f test-output-tools.log ]; then
            {
              echo "### Tool Test Output"
              echo '```'
              head -50 test-output-tools.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # GitHub reports a job killed by timeout-minutes as cancelled, which leaves
  # the run grey instead of red. This gate fails the run on any unsuccessful
  # job and on any cancellation a newer run does not explain (#301, #337).
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status-${{ inputs.model }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: always()
    needs:
      - test-model
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
