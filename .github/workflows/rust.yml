name: Rust CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**'
      - 'scripts/**'
      - '.github/workflows/rust.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'rust/**'
      - 'scripts/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least privilege by default; jobs that need to write escalate individually.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # actions/checkout runs `git init` before any repository config exists, which
  # prints a hint about the default branch name on every job. Setting it via
  # GIT_CONFIG_* silences the hint without an extra step.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # Every rustc and clippy warning fails the build, as in the Rust pipeline
  # template. Without it the lint job passed while clippy reported warnings
  # (issue #337). Cargo caps lints for dependencies, so only this crate is held
  # to it.
  RUSTFLAGS: -Dwarnings

# Concurrency is declared per job rather than once for the whole workflow
# (principle 10 of the CI/CD best practices, and the shape both pipeline
# templates use):
#
#   * read-only checks share `check-<workflow>-<ref>-<job>` and cancel in
#     progress off the default branch, so a force-push stops only the stale
#     copy of that one job instead of queueing the entire workflow;
#   * jobs that push to main or publish share the repository-wide
#     `main-writer-...` group and never cancel in progress, so a release is
#     never interrupted between the version bump and the publish, and the JS
#     and Rust releases cannot race each other.
jobs:
  # Changelog fragment check - only runs on PRs
  changelog-check:
    name: Changelog Fragment Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changelog-check
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for changelog fragments
        # BASE_REF is a branch name. Interpolating it directly into the script
        # would let a branch name execute shell code (zizmor template-injection).
        env:
          BASE_REF: ${{ github.base_ref }}
        # Only a fragment this pull request adds or edits counts: unreleased
        # fragments left by earlier pull requests used to satisfy the check,
        # and a missing fragment only warned, so Rust changes could merge
        # without ever being released (issue #337).
        run: |
          RANGE="origin/$BASE_REF...HEAD"
          SOURCE_CHANGED=$(git diff --name-only "$RANGE" -- rust/src rust/tests rust/Cargo.toml | wc -l)
          FRAGMENTS=$(git diff --name-only --diff-filter=AM "$RANGE" -- 'rust/changelog.d/*.md' | grep -cv '/README\.md$' || true)

          echo "Rust source files changed: $SOURCE_CHANGED; changelog fragments added: $FRAGMENTS"
          if [ "$SOURCE_CHANGED" -gt 0 ] && [ "$FRAGMENTS" -eq 0 ]; then
            echo "::error title=Missing Rust changelog fragment::Rust sources changed but no fragment was added to rust/changelog.d/. Create one with: touch rust/changelog.d/\$(date +%Y%m%d_%H%M%S)_description.md (see rust/changelog.d/README.md)."
            exit 1
          fi

          echo "Changelog check passed"

  # Lint and format check
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [changelog-check]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog-check.result == 'success' || needs.changelog-check.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Needed to merge the base branch below.
          fetch-depth: 0

      # refs/pull/N/merge is built when the pull request is synchronized, so
      # commits landing on the base branch afterwards are not checked. Merging
      # them here makes the checks below validate the real merge result.
      - name: Simulate fresh merge with base branch (PR only)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust

      - name: Fail on Cargo manifest warnings
        run: bash ../scripts/check-cargo-warnings.sh
        working-directory: rust

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features
        working-directory: rust

      - name: Build documentation
        # rustdoc-only lints (broken links, unclosed HTML tags) are not
        # reported by clippy or the tests, so they are denied here.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features
        working-directory: rust

      - name: Check file size limit
        run: node scripts/check-file-size.mjs

  # Test on multiple platforms
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [changelog-check]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog-check.result == 'success' || needs.changelog-check.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # Note: Windows skipped while bash tool tests use Unix-specific commands
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # The budget wrapper owns the deadline instead of the job's
      # timeout-minutes backstop: GitHub reports a job killed by
      # timeout-minutes as cancelled, not failed, so a suite that quietly
      # doubles in runtime would never be reported (issue #301).
      - name: Run tests
        run: bash ../scripts/run-with-budget-warning.sh 1200 "Cargo test suite" cargo test --all-features --verbose
        working-directory: rust
        # Note: Doc tests skipped - this is a binary crate without lib target

  # Build package - only runs if lint and test pass
  build:
    name: Build Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    needs: [lint, test]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Check package
        run: cargo package --list
        working-directory: rust

      - name: Build release
        run: bash ../scripts/run-with-budget-warning.sh 900 "Cargo release build" cargo build --release --verbose
        working-directory: rust

  # Automatic release on push to main using changelog fragments
  auto-release:
    name: Auto Release
    needs: [lint, test, build]
    # Use always() to ensure this job runs even when changelog-check was skipped (on push events)
    # Without always(), GitHub Actions skips jobs when any transitive dependency was skipped
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          # The 41898282+ prefix links the commit to the github-actions[bot]
          # account. Without it the commit is "unattributed" and a ruleset
          # requiring extra approval for unattributed changes blocks it.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type from changelog fragments
        id: bump_type
        run: node scripts/rust-get-bump-type.mjs

      # Any missing part of the current release (tag, crates.io version,
      # GitHub release) sends the job through publish and release, which skip
      # what already exists. An unreachable crates.io fails the job instead of
      # reading as "not published" (issue #337).
      - name: Check if version already released or no fragments
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
        run: node scripts/rust-release-state.mjs --repository "${{ github.repository }}"

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        run: |
          node scripts/rust-version-and-commit.mjs \
            --bump-type "${{ steps.bump_type.outputs.bump_type }}"

      # Re-read after the bump step so the released version is the bumped one.
      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        run: node scripts/rust-package-info.mjs

      - name: Build release
        if: steps.check.outputs.should_release == 'true'
        run: cargo build --release
        working-directory: rust

      # crates-io-auth-action reports a missing crates.io trusted publisher as
      # `##[error]` even under continue-on-error, so every token-published
      # release carried a false error annotation (issue #337). It only runs
      # once a maintainer has configured the trusted publisher on crates.io
      # and set the CRATES_IO_TRUSTED_PUBLISHING repository variable to true.
      - name: Authenticate with crates.io (trusted publishing)
        id: prm_auth
        # Trusted publishing first; the publish step falls back to the token secret.
        continue-on-error: true
        if: steps.check.outputs.should_release == 'true' && vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Explain the crates.io credential
        if: steps.check.outputs.should_release == 'true' && vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        run: >-
          echo "::notice title=crates.io publishes with the token secret::Trusted
          publishing is off. To publish through OIDC instead, add
          ${GITHUB_REPOSITORY} / rust.yml as a trusted publisher of the
          crate on crates.io, then set the CRATES_IO_TRUSTED_PUBLISHING
          repository variable to true."

      - name: Publish to crates.io
        id: publish
        if: steps.check.outputs.should_release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.prm_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: bash scripts/run-with-budget-warning.sh 600 "crates.io publish" node scripts/publish-to-crates.mjs --should-pull

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true' && (steps.publish.outputs.published == 'true' || steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/create-github-release.mjs \
            --release-version "${{ steps.current_version.outputs.version }}" \
            --repository "${{ github.repository }}" \
            --prefix "rust-"

      - name: Format GitHub release notes
        if: steps.check.outputs.should_release == 'true' && (steps.publish.outputs.published == 'true' || steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/format-github-release.mjs --release-version "${{ steps.current_version.outputs.version }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}" --prefix "rust-"

  # Manual release via workflow_dispatch
  manual-release:
    name: Manual Release
    needs: [lint, test, build]
    # Use always() to ensure this job runs even when changelog-check was skipped
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: main-writer-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          # The 41898282+ prefix links the commit to the github-actions[bot]
          # account. Without it the commit is "unattributed" and a ruleset
          # requiring extra approval for unattributed changes blocks it.
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Collect changelog fragments
        run: |
          # Check if there are any fragments to collect
          FRAGMENTS=$(find rust/changelog.d -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          if [ "$FRAGMENTS" -gt 0 ]; then
            echo "Found $FRAGMENTS changelog fragment(s), collecting..."
            node scripts/rust-collect-changelog.mjs
          else
            echo "No changelog fragments found, skipping collection"
          fi

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/rust-version-and-commit.mjs

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: cargo build --release
        working-directory: rust

      # crates-io-auth-action reports a missing crates.io trusted publisher as
      # `##[error]` even under continue-on-error, so every token-published
      # release carried a false error annotation (issue #337). It only runs
      # once a maintainer has configured the trusted publisher on crates.io
      # and set the CRATES_IO_TRUSTED_PUBLISHING repository variable to true.
      - name: Authenticate with crates.io (trusted publishing)
        id: prm_auth
        # Trusted publishing first; the publish step falls back to the token secret.
        continue-on-error: true
        if: (steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true') && vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Explain the crates.io credential
        if: (steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true') && vars.CRATES_IO_TRUSTED_PUBLISHING != 'true'
        run: >-
          echo "::notice title=crates.io publishes with the token secret::Trusted
          publishing is off. To publish through OIDC instead, add
          ${GITHUB_REPOSITORY} / rust.yml as a trusted publisher of the
          crate on crates.io, then set the CRATES_IO_TRUSTED_PUBLISHING
          repository variable to true."

      - name: Publish to crates.io
        id: publish
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.prm_auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
        run: bash scripts/run-with-budget-warning.sh 600 "crates.io publish" node scripts/publish-to-crates.mjs

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true' || steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/create-github-release.mjs \
            --release-version "${{ steps.version.outputs.new_version }}" \
            --repository "${{ github.repository }}" \
            --prefix "rust-"

      - name: Format GitHub release notes
        if: steps.publish.outputs.published == 'true' || steps.publish.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/format-github-release.mjs --release-version "${{ steps.version.outputs.new_version }}" --repository "${{ github.repository }}" --commit-sha "${{ github.sha }}" --prefix "rust-"

  # GitHub reports a job killed by timeout-minutes as cancelled rather than
  # failed, and every gate above is written as `result == 'success'`, so a
  # cancelled check silently skips the release and leaves the run green.
  # Observing every job here makes that visible.
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: always()
    needs:
      - changelog-check
      - lint
      - test
      - build
      - auto-release
      - manual-release
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: bash scripts/check-pipeline-status.sh
