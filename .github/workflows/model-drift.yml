name: Free Model Drift

on:
  schedule:
    - cron: '19 7 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'js/src/provider/**'
      - 'js/src/config/defaults.ts'
      - 'scripts/*model*.mjs'
      - '.github/workflows/model-drift.yml'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  model-drift:
    name: Check live free model catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-model-drift
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: js
      - name: Check built-in models against live provider catalogs
        shell: bash
        run: |
          mkdir -p ci-logs
          bun scripts/check-model-drift.mjs 2>&1 | tee ci-logs/model-drift.log
      - name: Preserve drift diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model-drift
          path: ci-logs/model-drift.log

  # GitHub reports a job killed by timeout-minutes as cancelled, which leaves
  # the run grey instead of red. This gate fails the run on any unsuccessful
  # job and on any cancellation a newer run does not explain (#301, #337).
  pipeline-status:
    name: Pipeline Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    if: always()
    needs:
      - model-drift
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Fail the run when a required job was cancelled or failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.ref }}
        run: bash scripts/check-pipeline-status.sh
